<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="sendinn.css">
</head>
<body>

    <div class="navbar_cont">
        <div class="navbar">
            <div>
                <a href="index.html"><img src="image-removebg-preview (2).png" alt="logo"></a>
            </div>
                <div class="nav">
                    <a href="index.html">Forside</a>
                    <a href="kontaktoss.html">Kontakt oss</a>
                </div>
        </div>
    </div>

    <div class="overskrift">
        <h1>Meld inn</h1>
    </div>


    <div class="container">
        <div class="kategori">
            <b>Kategori</b>
        </div>
        <div class="box">
            <div class="knapp">
                <details>
                    <summary>Gjenstand</summary>
                    <div class="gjenstand">
                        <div class="liste">
                            <input type="checkbox">
                            <p>Last</p>
                        </div>
                        <div class="liste">
                            <input type="checkbox">
                            <p>Teiner</p>
                        </div>
                        <div class="skriv">
                            <p>Annet:</p>
                            <input type="text" placeholder="skriv her">
                        </div>
                    </div>
                </details>
            </div>

            <div class="knapp">
                <details>
                    <summary>Kjøretøy</summary>
                    <div class="kjøretøy">
                        <div class="liste">
                            <input type="checkbox">
                            <p>Bil</p>
                        </div>
                        <div class="liste">
                            <input type="checkbox">
                            <p>Lastebil</p>
                        </div>
                        <div class="liste">
                            <input type="checkbox">
                            <p>Motorsykkel</p>
                        </div>
                        <div class="liste">
                            <input type="checkbox">
                            <p>Moped</p>
                        </div>
                        <div class="liste">
                            <input type="checkbox">
                            <p>Sykkel</p>
                        </div>
                        <div class="skriv">
                            <p>Annet:</p>
                            <input type="text" placeholder="skriv her">
                        </div>
                    </div>

                    <div class="regnummer">
                        <p>Registreringsnummer:</p>
                         <input type="text" placeholder="skriv her">
                        <p>Merke/Modell:</p>
                         <input type="text" placeholder="skriv her">
                        <p>Farge:</p>
                         <input type="text" placeholder="skriv her">
                        <p>Tilstand:</p>
                        <input type="text" placeholder="skriv her">
                    </div>
                </details>
            </div>
            
            
            
            <div class="knapp">
                <details>
                <summary>Dyr</summary>
                    <div class="dyr">
                        <div class="liste">
                            <input type="checkbox">
                            <p>Hund</p>
                        </div>
                        <div class="liste">
                            <input type="checkbox">
                            <p>Katt</p>
                        </div>
                        <div class="liste">
                            <input type="checkbox">
                            <p>Rådyr</p>
                        </div>
                        <div class="liste">
                            <input type="checkbox">
                            <p>Hare</p>
                        </div>
                        <div class="liste">
                            <input type="checkbox">
                            <p>Elg</p>
                        </div>
                        <div class="skriv">
                            <p>Annet:</p>
                            <input type="text" placeholder="skriv her">
                        </div>

                        <div class="info">
                            <p>Art/Rase:</p>
                             <input type="text" placeholder="skriv her">
                             <p>Kjønn:</p>
                            <div class="liste">
                                <input type="checkbox">
                                <p>Hankjønn</p>
                            </div>
                            <div class="liste">
                                <input type="checkbox">
                                <p>Hunkjønn</p>
                            </div>
                            <div class="liste">
                                <input type="checkbox">
                                <p>Usikkert</p>
                            </div>
                        </div>
                    </div>
                </details>
            </div>

            <div class="sknapp">
                <div class="sendknapp">
                    <p>Send inn</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

</body>
<script href="sendinn.js"></script>
</html>

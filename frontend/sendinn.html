<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meld inn</title>
    <link rel="stylesheet" href="sendinn.css">
</head>

<body>

    <div class="navbar_cont">
        <div class="navbar">
            <a href="index.html">
                <img src="image-removebg-preview (2).png" alt="logo">
            </a>
            <div class="nav">
                <a href="index.html">Forside</a>
                <a href="kontaktoss.html">Kontakt oss</a>
            </div>
        </div>
    </div>

    <h1 class="overskrift">Meld inn</h1>

    <div class="container">
        <div class="box">

            <details class="knapp">
                <summary>Gjenstand</summary>
                <div class="gjenstand">

                    <label><input type="checkbox" value="Last"> Last</label>
                    <label><input type="checkbox" value="Teiner"> Teiner</label>

                    <input type="text" id="gjenstandOther" placeholder="Annet">

                </div>
            </details>

            <details class="knapp">
                <summary>Kjøretøy</summary>
                <div class="kjøretøy">

                    <label><input type="checkbox" value="Bil"> Bil</label>
                    <label><input type="checkbox" value="Lastebil"> Lastebil</label>
                    <label><input type="checkbox" value="Motorsykkel"> Motorsykkel</label>
                    <label><input type="checkbox" value="Moped"> Moped</label>
                    <label><input type="checkbox" value="Sykkel"> Sykkel</label>

                    <input type="text" id="kjoretoyOther" placeholder="Annet">

                </div>

                <div class="regnummer">
                    <input id="regnr" placeholder="Registreringsnummer">
                    <input id="modell" placeholder="Merke/Modell">
                    <input id="farge" placeholder="Farge">
                    <input id="tilstand" placeholder="Tilstand">
                </div>
            </details>

            <details class="knapp">
                <summary>Dyr</summary>
                <div class="dyr">

                    <label><input type="checkbox" value="Hund"> Hund</label>
                    <label><input type="checkbox" value="Katt"> Katt</label>
                    <label><input type="checkbox" value="Rådyr"> Rådyr</label>
                    <label><input type="checkbox" value="Hare"> Hare</label>
                    <label><input type="checkbox" value="Elg"> Elg</label>

                    <input type="text" id="dyrOther" placeholder="Annet">

                    <div class="info">
                        <input id="rase" placeholder="Art/Rase">

                        <label><input type="radio" name="kjonn" value="Hankjønn"> Hankjønn</label>
                        <label><input type="radio" name="kjonn" value="Hunkjønn"> Hunkjønn</label>
                        <label><input type="radio" name="kjonn" value="Usikkert"> Usikkert</label>
                    </div>

                </div>
            </details>

            <button id="sendBtn">Send inn</button>

        </div>
    </div>

    <script src="sendinn.js"></script>
</body>

</html>
